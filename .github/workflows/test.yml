# Prüft bei jedem Push, dass alte Level gleich bleiben, alles lösbar ist und Links funktionieren.
name: Regressionstest
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/regress.js
  qr:
    # Liest 125 erzeugte QR-Codes mit zwei OpenCV-Decodern zurück
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy opencv-python-headless
      - run: python tests/qr_check.py
  e2e:
    # Spielt das Spiel in echtem Chromium (Ansagen, Dialoge, Fokus, Ladefehler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 &
      - run: node tests/e2e.mjs http://localhost:8765/
