<style>
  :root { --gold:#ffd27a; --ink:#e9ecf5; --dim:#8b93ad; }

  #hud { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between;
    padding:max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 14px max(18px, env(safe-area-inset-left));
    pointer-events:none; gap:12px; }

  #win.show { opacity:1; pointer-events:auto; }
  .card { background:rgba(12,16,34,.82); border:1px solid rgba(255,210,122,.25); border-radius:18px; padding:26px 34px;
    text-align:center; backdrop-filter:blur(6px); box-shadow:0 0 60px rgba(255,190,90,.15); transform:translateY(8px); transition:transform .5s; }
  #win.show .card { transform:none; }
  .card h2 { margin:0 0 6px; font-weight:300; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); font-size:20px; }
  .stars { font-size:34px; letter-spacing:8px; margin:10px 0 4px; }
  .stars .on { color:var(--gold); text-shadow:0 0 16px rgba(255,200,110,.8); }
  .stars .off { color:rgba(255,255,255,.12); }
  .card p { color:var(--dim); margin:6px 0 18px; font-size:14px; }
  .card .ctrl { justify-content:center; }
  .primary { background:rgba(255,210,122,.18); border-color:rgba(255,210,122,.5); }
  #daily { position:relative; }
  #daily.active { background:rgba(255,210,122,.22); border-color:rgba(255,210,122,.6); color:var(--gold); }
  #daily.fresh::after { content:""; position:absolute; top:4px; right:4px; width:7px; height:7px; border-radius:50%;
    background:var(--gold); box-shadow:0 0 8px var(--gold); }
  .card p small { display:block; margin-top:8px; opacity:.75; }
  button.title { background:none; border:none; padding:2px 4px 2px 0; text-align:left; border-radius:6px; }
  button.title:hover:not(:disabled) { background:none; }

  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0;
    transition:opacity .35s, background .35s; }
  .overlay.show { opacity:1; pointer-events:auto; background:rgba(3,5,12,.55); }
  .overlay.show .card { transform:none; }
  #levelGrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(56px, 1fr)); gap:8px; width:min(480px, 78vw);
    max-height:52vh; overflow:auto; margin:14px 0 18px; padding:4px; }
  #levelGrid button { padding:8px 0 6px; display:flex; flex-direction:column; align-items:center; gap:2px; font-variant-numeric:tabular-nums; }
  #levelGrid button small { font-size:10px; color:var(--gold); letter-spacing:1px; min-height:12px; }
  #levelGrid button.cur { border-color:rgba(255,210,122,.7); background:rgba(255,210,122,.14); }
  #tools { position:fixed; left:0; right:0; bottom:0; display:flex; flex-direction:column; gap:7px; align-items:center;

  #tools[hidden] { display:none; }

<script>
"use strict";
// ---------- Grundlagen ----------
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];          // 0 rechts, 1 unten, 2 links, 3 oben
const SLASH = [3, 2, 1, 0];                              // Spiegel "/"
const BACK  = [1, 0, 3, 2];                              // Spiegel "\"
const EMPTY = 0, WALL = 1, MIRROR = 2, CRYSTAL = 3, SRC = 4, RECV = 5, GATE = 6, SPLIT = 7;
const GOLD = 42;                                         // Farbton des ungefärbten Lichts
const GATE_LEVEL = 10;                                   // ab hier gibt es Farbtore
const SPLIT_LEVEL = 22;                                  // ab hier gibt es Strahlteiler
const HUES = [188, 312, 140, 265, 28];                   // Kristallfarben

function rng(seed) {
  let s = seed >>> 0;
  const next = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  return { next, int: n => Math.floor(next() * n),
    shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; } };
}

function params(n) {
  return {
    size: Math.min(5 + Math.floor((n - 1) / 3), 9),
    turns: Math.min(2 + Math.floor((n - 1) * 0.7), 12),
    crystals: Math.min(1 + Math.floor((n - 1) / 3), 4),
    decoys: Math.min(Math.floor((n - 1) * 0.7), 12),
    walls: Math.min(1 + Math.floor(n / 4), 8),
    lock: n >= 4 ? 0.25 : 0,
  };
}

// ---------- Levelgenerator: erst den Lösungsweg legen, dann verwürfeln ----------
// n bestimmt die Schwierigkeit, seed das konkrete Level (Standard: aus n abgeleitet).
function generate(n, seed = n * 1000003, opts = {}) {
  const gates = opts.gates ?? n >= GATE_LEVEL, splitters = opts.splitters ?? n >= SPLIT_LEVEL;
  const p = params(n), S = p.size;
  for (let attempt = 0; attempt < 5000; attempt++) {
    const R = rng(seed + attempt * 7919 + 17);
    const inb = (x, y) => x >= 0 && y >= 0 && x < S && y < S;
    const side = R.int(4), k = 1 + R.int(S - 2);
    let [x, y, d] = side === 0 ? [0, k, 0] : side === 1 ? [k, 0, 1] : side === 2 ? [S - 1, k, 2] : [k, S - 1, 3];
    const src = { x, y, d };
    const visited = new Set([x + y * S]);
    const straight = [], mirrors = [];
    let turns = 0, since = 0, recv = null;
    for (let step = 0; step < S * S; step++) {
      x += DX[d]; y += DY[d];
      if (!inb(x, y) || visited.has(x + y * S)) break;
      visited.add(x + y * S); since++;
      const fx = x + DX[d], fy = y + DY[d];
      const canStraight = inb(fx, fy) && !visited.has(fx + fy * S);
      if (turns < p.turns) {
        if (R.next() < 0.5 || !canStraight) {
          const opts = R.shuffle([(d + 1) % 4, (d + 3) % 4]).filter(nd => {
            const nx = x + DX[nd], ny = y + DY[nd]; return inb(nx, ny) && !visited.has(nx + ny * S); });
          if (opts.length) {
            const nd = opts[0];
            mirrors.push({ x, y, o: SLASH[d] === nd ? 0 : 1, d });
            d = nd; turns++; since = 0; continue;
          }
          if (!canStraight) break;
        }
        straight.push({ x, y, d });
      } else {
        if (!canStraight || (since >= 2 && R.next() < 0.4)) { recv = { x, y }; break; }
        straight.push({ x, y, d });
      }
    }
    if (!recv || turns < p.turns || straight.length < p.crystals) continue;

    const grid = Array.from({ length: S }, () => Array.from({ length: S }, () => ({ t: EMPTY })));
    grid[src.y][src.x] = { t: SRC, d: src.d };
    grid[recv.y][recv.x] = { t: RECV };
    const crystals = [];
    R.shuffle(straight.slice()).slice(0, p.crystals).forEach((c, i) => {
      const cell = { t: CRYSTAL, hue: HUES[i % HUES.length], shape: i % 5, x: c.x, y: c.y }; grid[c.y][c.x] = cell; crystals.push(cell); });
    const pathMirrors = mirrors.map(m => {
      const cell = { t: MIRROR, o: m.o, locked: R.next() < p.lock, x: m.x, y: m.y }; grid[m.y][m.x] = cell; return cell; });
    const free = [];
    for (let yy = 0; yy < S; yy++) for (let xx = 0; xx < S; xx++) if (grid[yy][xx].t === EMPTY && !visited.has(xx + yy * S)) free.push({ x: xx, y: yy });
    R.shuffle(free);
    for (let i = 0; i < p.decoys && free.length; i++) { const c = free.pop();
      grid[c.y][c.x] = { t: MIRROR, o: R.int(2), locked: R.next() < p.lock, x: c.x, y: c.y }; }
    for (let i = 0; i < p.walls && free.length; i++) { const c = free.pop(); grid[c.y][c.x] = { t: WALL }; }

    const rot = pathMirrors.filter(m => !m.locked);
    if (!rot.length) continue;
    const L = { n, size: S, grid, src, crystals, recvs: [grid[recv.y][recv.x]], par: 0 };
    rot.forEach(m => { if (R.next() < 0.65) { m.o ^= 1; m.flipped = true; } });
    let guard = 0;
    while (isSolved(L, trace(L)) && guard++ < rot.length) {
      const m = rot.find(m => !m.flipped); if (!m) break; m.o ^= 1; m.flipped = true; }
    if (isSolved(L, trace(L))) continue;
    L.par = rot.filter(m => m.flipped).length;
    for (const row of grid) for (const c of row) if (c.t === MIRROR) { c.ang = c.o === 0 ? -Math.PI / 4 : Math.PI / 4; c.target = c.ang; }
    if (gates) addGates(L, n, seed, straight, visited);
    if (splitters) addSplitter(L, n, seed, straight, mirrors, visited);
    return L;
  }
  throw new Error("Kein Level erzeugbar");
}

// Farbtore kommen erst nach dem fertigen Level dazu, mit eigenem Zufallsgenerator.
// Ein Tor auf dem Lösungsweg bekommt genau die Farbe, die das Licht dort in der Lösung hat;
// die Lösung bleibt also gültig, aber falsch gefärbtes Licht kommt nicht mehr durch.
function addGates(L, n, seed, straight, visited) {
  const R = rng(((seed ^ 0x5bd1e995) >>> 0) + 4242), S = L.size;
  const order = L.crystals.map(c => ({ c, i: straight.findIndex(s => s.x === c.x && s.y === c.y) })).sort((a, b) => a.i - b.i);
  const colorAt = j => { let col = null; for (const o of order) if (o.i < j) col = o.c; return col; };   // null = Gold
  const makeGate = (x, y, col) => { L.grid[y][x] = { t: GATE, hue: col ? col.hue : GOLD, shape: col ? col.shape : -1, x, y }; };
  const cand = R.shuffle(straight.map((s, j) => ({ x: s.x, y: s.y, j })).filter(s => L.grid[s.y][s.x].t === EMPTY));
  const want = Math.min(1 + Math.floor((n - GATE_LEVEL) / 4), 3), picks = [];
  const first = cand.find(s => colorAt(s.j)) || cand[0];        // das erste Tor möglichst farbig
  if (first) picks.push(first);
  for (const s of cand) { if (picks.length >= want) break; if (!picks.includes(s)) picks.push(s); }
  for (const s of picks) makeGate(s.x, s.y, colorAt(s.j));
  const free = [];
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) if (L.grid[y][x].t === EMPTY && !visited.has(x + y * S)) free.push({ x, y });
  R.shuffle(free);
  const cols = [null, ...L.crystals];
  for (let i = 0; i < Math.min(Math.floor((n - GATE_LEVEL) / 6), 2) && free.length; i++) { const f = free.pop(); makeGate(f.x, f.y, cols[R.int(cols.length)]); }
}

// Strahlteiler: entweder auf ein gerades, leeres Feld des Lösungswegs (der Zweig geht zur Seite ab)
// oder anstelle eines drehbaren Spiegels des Lösungswegs (gespiegelt wird wie bisher, der durchgelassene
// Teil bildet den Zweig). Vom Teiler aus führt ein zweiter Weg mit 0–2 Spiegeln zu einer zweiten Linse,
// nur über Felder, die noch völlig frei sind. Eigener Zufall: der Rest des Levels bleibt, wie er war.
function addSplitter(L, n, seed, straight, mirrors, visited) {
  const R = rng(((seed ^ 0x27d4eb2f) >>> 0) + 777), S = L.size;
  const inb = (x, y) => x >= 0 && y >= 0 && x < S && y < S;
  const cand = R.shuffle([
    ...straight.filter(s => L.grid[s.y][s.x].t === EMPTY).map(s => ({ x: s.x, y: s.y, dirs: [(s.d + 1) % 4, (s.d + 3) % 4], d: s.d })),
    ...mirrors.filter(m => !L.grid[m.y][m.x].locked).map(m => ({ x: m.x, y: m.y, dirs: [m.d], onMirror: true })),
  ]);
  for (const s of cand) for (let attempt = 0; attempt < 60; attempt++) {
    const rd = s.dirs[R.int(s.dirs.length)], used = new Set(), branch = [];
    const free = (x, y) => inb(x, y) && !visited.has(x + y * S) && !used.has(x + y * S) && L.grid[y][x].t === EMPTY;
    const want = R.int(3);                      // 0–2 Knicke; bei 0 ist die Drehung des Teilers das Rätsel
    let x = s.x, y = s.y, d = rd, turns = 0, since = 0, end = null;
    for (let step = 0; step < S * S; step++) {
      x += DX[d]; y += DY[d];
      if (!free(x, y)) break;
      used.add(x + y * S); since++;
      const canStraight = free(x + DX[d], y + DY[d]);
      if (turns < want) {
        if (R.next() < .5 || !canStraight) {
          const opts = R.shuffle([(d + 1) % 4, (d + 3) % 4]).filter(nd => free(x + DX[nd], y + DY[nd]));
          if (opts.length) { branch.push({ x, y, o: SLASH[d] === opts[0] ? 0 : 1 }); d = opts[0]; turns++; since = 0; continue; }
          if (!canStraight) break;
        }
      } else if (!canStraight || (since >= 2 && R.next() < .4)) { end = { x, y }; break; }
    }
    if (!end || used.size < 3) continue;          // Zweig mit mindestens drei Feldern, sonst zu billig
    const old = L.grid[s.y][s.x];
    const split = L.grid[s.y][s.x] = s.onMirror
      ? { t: SPLIT, o: old.o, flipped: old.flipped, x: s.x, y: s.y }          // übernimmt Stellung und Wertung des Spiegels
      : { t: SPLIT, o: SLASH[s.d] === rd ? 0 : 1, x: s.x, y: s.y };
    const cells = branch.map(m => (L.grid[m.y][m.x] = { t: MIRROR, o: m.o, locked: false, x: m.x, y: m.y }));
    L.recvs.push(L.grid[end.y][end.x] = { t: RECV, x: end.x, y: end.y });
    for (const k of used) visited.add(k);
    const rot = s.onMirror ? cells : [split, ...cells];
    let added = 0;
    rot.forEach(c => { if (R.next() < .6) { c.o ^= 1; c.flipped = true; added++; } });
    if (!added && rot.length) { rot[0].o ^= 1; rot[0].flipped = true; added++; }
    if (isSolved(L, trace(L))) { const c = rot.find(c => !c.flipped); if (c) { c.o ^= 1; c.flipped = true; added++; } }
    L.par += added;
    for (const c of [split, ...cells]) { c.ang = c.o === 0 ? -Math.PI / 4 : Math.PI / 4; c.target = c.ang; }
    return true;
  }
  return false;
}

// ---------- Strahlverfolgung ----------
// Mehrere Strahlen: ein Strahlteiler lässt das Licht durch und startet zugleich einen gespiegelten Strahl.
// Jeder Strahl kennt seinen Start (Entfernung von der Quelle), damit alle gemeinsam wachsen.
const rotatable = c => !!c && ((c.t === MIRROR && !c.locked) || c.t === SPLIT);
function trace(L) {
  if (!L.src) return { beams: [], events: [], blocked: [], hits: new Set(), dist: 0 };
  const S = L.size, seen = new Set(), beams = [], events = [], blocked = [], hits = new Set();
  const queue = [{ x: L.src.x, y: L.src.y, d: L.src.d, hue: GOLD, start: 0 }];
  while (queue.length && beams.length < 32) {
    const b = queue.shift();
    let { x, y, d, hue } = b, px = x + .5, py = y + .5, dist = b.start;
    const pts = [{ x: px, y: py }], bev = [];
    for (let i = 0; i < 600; i++) {
      const nx = x + DX[d], ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= S || ny >= S) { px += DX[d] * .85; py += DY[d] * .85; dist += .85; break; }
      const c = L.grid[ny][nx];
      if (c.t === WALL || c.t === SRC) { px += DX[d] * .5; py += DY[d] * .5; dist += .5; break; }
      if (c.t === GATE && c.hue !== hue) { px += DX[d] * .62; py += DY[d] * .62; dist += .62; blocked.push(c); break; }   // falsche Farbe
      x = nx; y = ny; px = x + .5; py = y + .5; dist += 1;
      const key = (x + y * S) * 4 + d;
      if (seen.has(key)) break;
      seen.add(key);
      if (c.t === MIRROR) { pts.push({ x: px, y: py }); d = c.o === 0 ? SLASH[d] : BACK[d]; }
      else if (c.t === SPLIT) { pts.push({ x: px, y: py }); queue.push({ x, y, d: c.o === 0 ? SLASH[d] : BACK[d], hue, start: dist }); bev.push({ dist, cell: c, hue }); }
      else if (c.t === CRYSTAL) { hue = c.hue; bev.push({ dist, cell: c, hue }); }
      else if (c.t === GATE) bev.push({ dist, cell: c, hue });

  if (!lv) { loadLevel(save.current || 1); $("hint").textContent = "Dieser Level-Link ist leider kaputt."; $("hint").style.opacity = 1; layout(); return; }
  mode = "custom"; customCode = code; customFromEditor = fromEditor;
  startPlay(lv);
  setHash("#l=" + code);
  $("lvl").textContent = fromEditor ? "Test: eigenes Level" : "Geteiltes Level";
  $("prev").disabled = $("next").disabled = true; $("daily").classList.remove("active");
  $("hint").textContent = `${fromEditor ? "So sieht es für andere aus." : "Jemand hat dieses Level für dich gebaut."} Ziel: ${lv.par} ${lv.par === 1 ? "Zug" : "Züge"}.`;
  $("hint").style.opacity = 1; layout();
}

// ---------- Zeichnen ----------
const cv = $("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, cs = 40, ox = 0, oy = 0;
const stars = Array.from({ length: 160 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.2 + .2, p: Math.random() * 6.28, s: .5 + Math.random() * 1.5 }));
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR;
  if (!L) return;
  const top = Math.ceil($("hud").getBoundingClientRect().bottom) + 6,
    bottom = !$("tools").hidden ? $("tools").getBoundingClientRect().height + 8
      : Math.max(60, ($("hint").textContent ? $("hint").getBoundingClientRect().height : 0) + 34), avail = Math.min(W - 32, H - top - bottom);
  cs = Math.floor(avail / (L.size + .6));
  ox = Math.round((W - cs * L.size) / 2); oy = Math.round(top + (H - top - bottom - cs * L.size) / 2);
  for (let y = 0; y < L.size; y++) for (let x = 0; x < L.size; x++) { const c = L.grid[y][x]; c._x = ox + (x + .5) * cs; c._y = oy + (y + .5) * cs; }
}
addEventListener("resize", layout);

const X = u => ox + u * cs, Y = u => oy + u * cs;
// Jeder Kristall hat eine eigene Form, damit man sie nicht nur an der Farbe unterscheidet.
function crystalPath(shape, r) {
  ctx.beginPath();
  const poly = (n, rad, rot, dy = 0) => { for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad + dy); } };
  if (shape === 0) { ctx.moveTo(0, -r * 1.25); ctx.lineTo(r, 0); ctx.lineTo(0, r * 1.25); ctx.lineTo(-r, 0); }   // Raute
  else if (shape === 1) poly(3, r * 1.3, -Math.PI / 2, r * .2);                                                  // Dreieck
  else if (shape === 2) poly(6, r * 1.1, 0);                                                                     // Sechseck
  else if (shape === 3) for (let i = 0; i < 8; i++) { const a = -Math.PI / 2 + i * Math.PI / 4, rr = i % 2 ? r * .5 : r * 1.25; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } // Stern
  else ctx.arc(0, 0, r * 1.05, 0, 6.283);                                                                        // Kreis
  ctx.closePath();
}
function burst(x, y, hue, n = 24, sp = 1) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = (40 + Math.random() * 160) * sp;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: .6 + Math.random() * .8, hue, r: 1 + Math.random() * 2 }); }
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// Strahl in farbigen Abschnitten bis zur gezeigten Länge zeichnen (Entfernungen ab der Quelle gemessen)
function beamSections(b) {
  const secs = [], upto = Math.min(shown, b.end); let from = b.start, hue = b.hue;
  for (const e of b.events) { if (e.dist > upto) break; if (e.cell.t === CRYSTAL) { secs.push({ from, to: e.dist, hue }); from = e.dist; hue = e.cell.hue; } }
  secs.push({ from, to: upto, hue });

}
function strokeRange(beam, a0, b0) {
  const P = beam.pts, a = a0 - beam.start, b = b0 - beam.start; let acc = 0; ctx.beginPath(); let started = false;
  for (let i = 1; i < P.length; i++) {
    const p0 = P[i - 1], p1 = P[i], len = Math.hypot(p1.x - p0.x, p1.y - p0.y);
    const s = Math.max(a, acc), e = Math.min(b, acc + len);
    if (e > s && len > 0) {
      const t0 = (s - acc) / len, t1 = (e - acc) / len;
      if (!started) { ctx.moveTo(X(p0.x + (p1.x - p0.x) * t0), Y(p0.y + (p1.y - p0.y) * t0)); started = true; }
      ctx.lineTo(X(p0.x + (p1.x - p0.x) * t1), Y(p0.y + (p1.y - p0.y) * t1));
    }
    acc += len; if (acc >= b) break;

}
function pointAt(beam, d0) {
  const P = beam.pts, dd = d0 - beam.start; let acc = 0;
  for (let i = 1; i < P.length; i++) { const p0 = P[i - 1], p1 = P[i], len = Math.hypot(p1.x - p0.x, p1.y - p0.y);
    if (len > 0 && acc + len >= dd) { const t = (dd - acc) / len; return { x: X(p0.x + (p1.x - p0.x) * t), y: Y(p0.y + (p1.y - p0.y) * t) }; } acc += len; }

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Himmel
  const g = ctx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, Math.max(W, H) * .8);
  g.addColorStop(0, "#141a36"); g.addColorStop(1, "#05070f");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.globalAlpha = .25 + .35 * Math.sin(t * s.s + s.p) ** 2; ctx.fillStyle = "#cfd8ff"; ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (!L) return requestAnimationFrame(frame);

  // Strahl fortschreiten lassen
  shown = Math.min(T.dist, shown + dt * 13);
  const lit = new Set(); for (const e of T.events) if (e.dist <= shown) lit.add(e.cell);
  for (const c of lit) if (!litPrev.has(c) && c.t === CRYSTAL) { bell(note(L.crystals.indexOf(c) + 2), 0, .09); burst(c._x, c._y, c.hue, 26); buzz(14);
    say(`Kristall leuchtet: ${L.crystals.filter(k => lit.has(k)).length} von ${L.crystals.length}`); }
  litPrev = lit;
  if (!won && mode !== "edit" && shown >= T.dist && isSolved(L, T)) onWin();
  if (T.blocked.length && shown >= T.dist && !T.signaled) { T.signaled = true; tone(146, .35, .07, "sine"); tone(110, .45, .05, "triangle"); buzz(30); say("Ein Farbtor blockiert das Licht."); }
  for (const r of L.recvs) { const e = T.events.find(e => e.cell === r && e.dist <= shown); r._hue = e ? e.hue : GOLD; }

  // Brett
  const S = L.size;
  ctx.fillStyle = "rgba(255,255,255,.025)"; roundRect(ox - 8, oy - 8, cs * S + 16, cs * S + 16, 14); ctx.fill();
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    ctx.fillStyle = (x + y) % 2 ? "rgba(255,255,255,.035)" : "rgba(255,255,255,.05)";
    roundRect(ox + x * cs + 2, oy + y * cs + 2, cs - 4, cs - 4, cs * .12); ctx.fill();
  }

  // Objekte
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const c = L.grid[y][x], cx = c._x, cy = c._y;
    if (c.t === WALL) {
      const gg = ctx.createLinearGradient(0, cy - cs / 2, 0, cy + cs / 2); gg.addColorStop(0, "#3a4160"); gg.addColorStop(1, "#1b2038");
      ctx.fillStyle = gg; roundRect(cx - cs * .42, cy - cs * .42, cs * .84, cs * .84, cs * .12); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.stroke();
    } else if (c.t === MIRROR) {
      c.ang += (c.target - c.ang) * Math.min(1, dt * 16);
      const hov = hover === c && !c.locked && !won;
      if (c.locked) {
        ctx.fillStyle = "rgba(160,120,70,.18)"; roundRect(cx - cs * .3, cy - cs * .3, cs * .6, cs * .6, cs * .08); ctx.fill();
      } else {
        ctx.fillStyle = hov ? "rgba(255,220,150,.16)" : "rgba(255,255,255,.06)"; ctx.beginPath(); ctx.arc(cx, cy, cs * .36, 0, 6.283); ctx.fill();
        if (hov) { ctx.strokeStyle = "rgba(255,220,150,.45)"; ctx.lineWidth = 1.5; ctx.stroke(); }
      }
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(c.ang);
      const len = cs * .4, wd = Math.max(3, cs * .085);
      const mg = ctx.createLinearGradient(0, -wd, 0, wd);
      if (c.locked) { mg.addColorStop(0, "#f0d2a0"); mg.addColorStop(1, "#8a6a3c"); } else { mg.addColorStop(0, "#ffffff"); mg.addColorStop(.5, "#c9d3ee"); mg.addColorStop(1, "#6d7898"); }
      ctx.fillStyle = mg; roundRect(-len, -wd / 2, len * 2, wd, wd / 2); ctx.fill();
      ctx.restore();
      if (c.locked) { ctx.fillStyle = "#c9a46a"; for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { ctx.beginPath(); ctx.arc(cx + a * cs * .22, cy + b * cs * .22, Math.max(1.5, cs * .03), 0, 6.283); ctx.fill(); } }
    } else if (c.t === SPLIT) {
      c.ang += (c.target - c.ang) * Math.min(1, dt * 16);
      const hov = hover === c && !won;
      ctx.fillStyle = hov ? "rgba(150,230,255,.18)" : "rgba(150,220,255,.07)"; ctx.beginPath(); ctx.arc(cx, cy, cs * .36, 0, 6.283); ctx.fill();
      if (hov) { ctx.strokeStyle = "rgba(170,235,255,.5)"; ctx.lineWidth = 1.5; ctx.stroke(); }
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(c.ang);
      const len = cs * .4, wd = Math.max(3, cs * .08);
      roundRect(-len, -wd / 2, len * 2, wd, wd / 2);
      ctx.fillStyle = "rgba(160,225,255,.28)"; ctx.fill();
      ctx.setLineDash([Math.max(2, cs * .05), Math.max(2, cs * .04)]);   // gestrichelt = halbdurchlässig
      ctx.strokeStyle = "rgba(215,245,255,.95)"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.restore();
    } else if (c.t === GATE) {
      const open = lit.has(c), shut = T.blocked.includes(c) && shown >= T.dist;
      const col = (a, l) => `hsla(${c.hue},${c.hue === GOLD ? 95 : 90}%,${l}%,${a})`;
      roundRect(cx - cs * .38, cy - cs * .38, cs * .76, cs * .76, cs * .16);
      ctx.fillStyle = col(open ? .26 : shut ? .1 + .18 * Math.abs(Math.sin(t * 9)) : .08, 60); ctx.fill();
      ctx.lineWidth = Math.max(2, cs * .055); ctx.strokeStyle = col(open ? .95 : .55, open ? 78 : 62); ctx.stroke();
      ctx.fillStyle = col(.5, 70);   // Pfosten
      for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { ctx.beginPath(); ctx.arc(cx + a * cs * .38, cy + b * cs * .38, Math.max(1.5, cs * .045), 0, 6.283); ctx.fill(); }
      ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = col(open ? .95 : .65, open ? 85 : 68);
      if (c.shape < 0) { ctx.beginPath(); ctx.arc(0, 0, cs * .09, 0, 6.283); } else crystalPath(c.shape, cs * .1);
      ctx.fill(); ctx.restore();
    } else if (c.t === SRC) {
      const pulse = 1 + .08 * Math.sin(t * 3);
      const sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, cs * .6 * pulse); sg.addColorStop(0, "rgba(255,220,140,.9)"); sg.addColorStop(.35, "rgba(255,190,90,.35)"); sg.addColorStop(1, "rgba(255,190,90,0)");
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(cx, cy, cs * .6 * pulse, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#fff4d8"; ctx.beginPath(); ctx.arc(cx, cy, cs * .13, 0, 6.283); ctx.fill();
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(c.d * Math.PI / 2); ctx.fillStyle = "rgba(255,230,170,.85)";
      ctx.beginPath(); ctx.moveTo(cs * .38, 0); ctx.lineTo(cs * .24, -cs * .08); ctx.lineTo(cs * .24, cs * .08); ctx.closePath(); ctx.fill(); ctx.restore();
    }

  const flick = .9 + .1 * Math.sin(t * 23) * Math.sin(t * 7);
  for (const b of T.beams) {
    if (shown <= b.start) continue;
    for (const s of beamSections(b)) {
      if (s.to <= s.from) continue;
      const layers = [[.34, .07], [.17, .16], [.07, .55], [.025, .95]];
      layers.forEach(([w, a], i) => {
        ctx.lineWidth = Math.max(1, cs * w);
        ctx.strokeStyle = i === 3 ? `rgba(255,255,255,${a * flick})` : `hsla(${s.hue},95%,${s.hue === GOLD ? 66 : 62}%,${a * flick})`;
        strokeRange(b, s.from, s.to);
      });
    }
    if (shown < b.end) { const h = pointAt(b, shown), hg = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, cs * .35);
      hg.addColorStop(0, "rgba(255,255,255,.9)"); hg.addColorStop(1, "rgba(255,255,255,0)"); ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(h.x, h.y, cs * .35, 0, 6.283); ctx.fill(); }
  }
  ctx.restore();

  // Kristalle & Linse über dem Strahl
  for (const c of L.crystals) {
    const on = lit.has(c), r = cs * .27 * (on ? 1 + .05 * Math.sin(t * 4 + c.hue) : 1);
    if (on) { const cg = ctx.createRadialGradient(c._x, c._y, 0, c._x, c._y, cs * .75); cg.addColorStop(0, `hsla(${c.hue},100%,70%,.55)`); cg.addColorStop(1, `hsla(${c.hue},100%,60%,0)`);
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(c._x, c._y, cs * .75, 0, 6.283); ctx.fill(); ctx.restore(); }
    ctx.save(); ctx.translate(c._x, c._y);
    const sway = Math.sin(t * 1.3 + c.hue) * .08;
    ctx.rotate(sway);
    crystalPath(c.shape, r);
    ctx.fillStyle = on ? `hsla(${c.hue},90%,72%,.95)` : `hsla(${c.hue},40%,25%,.85)`; ctx.fill();
    ctx.strokeStyle = on ? `hsla(${c.hue},100%,92%,1)` : `hsla(${c.hue},60%,55%,.7)`; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.scale(.45, .45); crystalPath(c.shape, r);   // innere Facette
    ctx.strokeStyle = on ? "rgba(255,255,255,.6)" : "rgba(255,255,255,.14)"; ctx.lineWidth = 1 / .45; ctx.stroke();
    ctx.restore();
  }
  for (const c of L.recvs) { const on = lit.has(c), hue = on ? c._hue : GOLD;
    if (on) { ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.translate(c._x, c._y); ctx.rotate(t * .6);
      for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.fillStyle = `hsla(${hue},100%,70%,${.12 + .08 * Math.sin(t * 3 + i)})`;
        ctx.beginPath(); ctx.moveTo(cs * .2, -cs * .04); ctx.lineTo(cs * (.85 + .1 * Math.sin(t * 2 + i * 1.7)), 0); ctx.lineTo(cs * .2, cs * .04); ctx.fill(); }
      ctx.restore(); }
    ctx.beginPath(); ctx.arc(c._x, c._y, cs * .3, 0, 6.283);
    ctx.strokeStyle = on ? `hsla(${hue},100%,80%,1)` : "rgba(255,210,122,.45)"; ctx.lineWidth = Math.max(2, cs * .05); ctx.stroke();
    ctx.beginPath(); ctx.arc(c._x, c._y, cs * .17, 0, 6.283);
    ctx.fillStyle = on ? `hsla(${hue},100%,85%,1)` : "rgba(255,210,122,.12)"; ctx.fill();
  }

  if (mode === "edit" && hover) {
    ctx.save(); ctx.strokeStyle = "rgba(255,220,150,.55)"; ctx.lineWidth = 2;
    roundRect(hover._x - cs * .47, hover._y - cs * .47, cs * .94, cs * .94, cs * .14); ctx.stroke(); ctx.restore();
  }

  // Tastatur-Auswahlrahmen
  if (cursorOn && cursor && !won) {
    const cx = ox + (cursor.x + .5) * cs, cy = oy + (cursor.y + .5) * cs;
    ctx.save(); ctx.strokeStyle = `rgba(255,220,150,${.65 + .3 * Math.sin(t * 5)})`; ctx.lineWidth = 2;
    ctx.setLineDash([cs * .14, cs * .09]); ctx.lineDashOffset = -t * 18;
    roundRect(cx - cs * .47, cy - cs * .47, cs * .94, cs * .94, cs * .14); ctx.stroke(); ctx.restore();
  }

  // Partikel
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  particles = particles.filter(p => (p.life -= dt * p.decay) > 0);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96;
    ctx.fillStyle = `hsla(${p.hue},100%,75%,${p.life})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + p.life), 0, 6.283); ctx.fill(); }
  ctx.restore();

  requestAnimationFrame(frame);
}

// ---------- Eingabe ----------
function cellAt(ev) {
  if (!L) return null;
  const x = Math.floor((ev.clientX - ox) / cs), y = Math.floor((ev.clientY - oy) / cs);
  return x >= 0 && y >= 0 && x < L.size && y < L.size ? L.grid[y][x] : null;
}
cv.addEventListener("pointermove", ev => { hover = cellAt(ev); cv.style.cursor = rotatable(hover) && !won ? "pointer" : "default"; });
cv.addEventListener("pointerdown", ev => { audio(); cursorOn = false; if (mode === "edit") editAt(cellAt(ev)); else flip(cellAt(ev)); });
cv.addEventListener("pointermove", () => { if (mode === "edit") cv.style.cursor = hover ? "pointer" : "default"; });
const restart = () => mode === "daily" ? loadDaily() : mode === "custom" ? loadCustom(customCode, customFromEditor) : mode === "edit" ? null : loadLevel(L.n);
const proceed = () => mode === "daily" ? loadLevel(save.current || 1)
  : mode === "custom" ? (customFromEditor ? openEditor() : loadLevel(save.current || 1)) : loadLevel(L.n + 1);
const toggleDaily = () => mode === "daily" ? loadLevel(save.current || 1) : loadDaily();
const nextLevel = () => { if (mode === "level" && L.n < save.unlocked) loadLevel(L.n + 1); };
const prevLevel = () => { if (mode === "level" && L.n > 1) loadLevel(L.n - 1); };

// Pfeiltasten: zum nächstgelegenen drehbaren Spiegel in dieser Richtung springen, sonst ein Feld weiter.
function moveCursor(d) {
  if (!cursorOn || !cursor) {
    cursorOn = true;
    if (!cursor) { const m = L.grid.flat().find(rotatable); cursor = m ? { x: m.x, y: m.y } : { x: L.src.x, y: L.src.y }; }
    return;
  }
  let best = null, bestScore = Infinity;
  for (const c of L.grid.flat()) {
    if (!rotatable(c)) continue;
    const vx = c.x - cursor.x, vy = c.y - cursor.y, along = vx * DX[d] + vy * DY[d], side = Math.abs(vx * DY[d] - vy * DX[d]);
    if (along <= 0 || side > along * 2) continue;
    const score = along + side * 2;
    if (score < bestScore) { bestScore = score; best = c; }
  }
  if (best) cursor = { x: best.x, y: best.y };
  else cursor = { x: Math.max(0, Math.min(L.size - 1, cursor.x + DX[d])), y: Math.max(0, Math.min(L.size - 1, cursor.y + DY[d])) };
}

function openLevels() {
  const g = $("levelGrid"); g.innerHTML = "";
  const total = Math.max(10, Math.ceil(save.unlocked / 10) * 10);
  let sum = 0;
  for (let n = 1; n <= total; n++) {
    const open = n <= save.unlocked, st = save.stars[n] || 0, b = document.createElement("button");
    sum += st; b.disabled = !open;
    b.innerHTML = `${n}<small>${open ? "★".repeat(st) : "🔒"}</small>`;
    b.setAttribute("aria-label", open ? `Level ${n}, ${st} Sterne` : `Level ${n}, gesperrt`);
    if (mode === "level" && L.n === n) b.className = "cur";
    b.onclick = () => { closeLevels(); loadLevel(n); };
    g.append(b);
  }
  $("levelsInfo").textContent = `${save.unlocked - 1} gelöst · ${sum} von ${(save.unlocked - 1) * 3} Sternen`;
  $("levels").classList.add("show");
  const cur = g.querySelector(".cur") || g.querySelectorAll("button:not(:disabled)")[save.unlocked - 1];
  if (cur) { cur.scrollIntoView({ block: "nearest" }); cur.focus({ preventScroll: true }); }
}
function closeLevels() { $("levels").classList.remove("show"); }

const ARROWS = { arrowright: 0, arrowdown: 1, arrowleft: 2, arrowup: 3 };
addEventListener("keydown", ev => {
  const k = ev.key.toLowerCase();
  if ((ev.ctrlKey || ev.metaKey) && k === "z") { ev.preventDefault(); undo(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if ($("levels").classList.contains("show")) { if (k === "escape" || k === "l") closeLevels(); return; }
  if (mode === "edit") { if (k === "m") toggleMute(); else if (k === "l") openLevels(); else if (k === "t") loadDaily(); return; }
  if (ev.target.tagName === "BUTTON" && (k === " " || k === "enter")) return;   // fokussierter Button bedient sich selbst
  if (k in ARROWS) { ev.preventDefault(); moveCursor(ARROWS[k]); }
  else if (k === " " || (k === "enter" && !won)) { ev.preventDefault(); if (cursorOn && cursor) flip(L.grid[cursor.y][cursor.x]); else moveCursor(0); }
  else if (k === "enter") proceed();
  else if (k === "r") restart();
  else if (k === "z" || k === "backspace") undo();
  else if (k === "t") toggleDaily();
  else if (k === "m") toggleMute();
  else if (k === "l") openLevels();
  else if (k === "n") won ? proceed() : nextLevel();
  else if (k === "p") prevLevel();
});
function toggleMute() { muted = !muted; localStorage.setItem("lichtweg-muted", muted ? "1" : "0"); $("mute").style.opacity = muted ? .4 : 1; }
$("prev").onclick = prevLevel;
$("next").onclick = nextLevel;
$("undo").onclick = undo;
$("titleBtn").onclick = openLevels;
$("closeLevels").onclick = closeLevels;
$("levels").addEventListener("pointerdown", ev => { if (ev.target === $("levels")) closeLevels(); });
// Nach Mausklick den Fokus vom Button nehmen, damit Leertaste wieder den Spiegel dreht
document.addEventListener("pointerup", ev => { const b = ev.target.closest("button"); if (b) b.blur(); });
$("reset").onclick = restart;
$("again").onclick = restart;
$("go").onclick = proceed;
$("share").onclick = shareDaily;
$("build").onclick = () => openEditor();
$("esize").onchange = () => resizeEditor(+$("esize").value);
$("eclear").onclick = () => { const size = L.size; L = EDIT_DEFAULT(); if (size !== 7) resizeEditor(size); else { T = trace(L); shown = 0; layout(); saveDraft(); editStatus(); } };
$("etest").onclick = () => { const code = scrambleForShare(); if (code) loadCustom(code, true); };
$("eshare").onclick = async () => { const code = scrambleForShare(); if (!code) return;
  const ok = await shareText(`Lichtweg · Ein Level für dich\n` + levelLink(code), null);
  editMsg(ok === false ? "Kopieren hat nicht geklappt. Link: " + levelLink(code) : "Link kopiert – jedes Teilen verdreht die Spiegel neu."); };
$("edone").onclick = () => loadLevel(save.current || 1);
$("daily").onclick = toggleDaily;
$("mute").onclick = toggleMute;
$("mute").style.opacity = muted ? .4 : 1;
addEventListener("hashchange", () => {
  const h = location.hash;
  if (h === "#heute" && mode !== "daily") loadDaily();
  else if (h === "#bauen" && mode !== "edit") openEditor();
  else if (h.startsWith("#l=") && (mode !== "custom" || h.slice(3) !== customCode)) loadCustom(h.slice(3));
});
// Tab offen über Mitternacht: Badge aktualisieren, damit das neue Rätsel auffällt
setInterval(updateDailyBadge, 60000);

// Offline-Fähigkeit und "Als App installieren"
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
let installPrompt = null;
addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); installPrompt = ev; $("install").hidden = false; });
addEventListener("appinstalled", () => { installPrompt = null; $("install").hidden = true; });
$("install").onclick = async () => { if (!installPrompt) return; installPrompt.prompt(); await installPrompt.userChoice; installPrompt = null; $("install").hidden = true; };

layout();
if (location.hash.startsWith("#l=")) loadCustom(location.hash.slice(3));
else if (location.hash === "#bauen") openEditor();
else if (location.hash === "#heute" || (save.mode === "daily" && !location.hash)) loadDaily(); else loadLevel(save.current || 1);
requestAnimationFrame(frame);
</script>
</body>
</html>
